[tox]
envlist=clear,
    d{12,13,14,15,16,17,18}-py27,
    d{19,110}-py{27,35},
    d111-py{27,35,36,37},
    d{20,21}-py{35,36,37},
    d22-py{35,36,37,38},
    d30-py{36,37,38},
    stats

[testenv]
indexserver=https://py.mdrn.pl:8443
commands=coverage run --source=fnp_django_pagination --omit *runner*,*test_project* setup.py test
deps=
    d12: Django>=1.2,<1.3
    d13: Django>=1.3,<1.4
    d14: Django>=1.4,<1.5
    d15: Django>=1.5,<1.6
    d16: Django>=1.6,<1.7
    d17: Django>=1.7,<1.8
    d18: Django>=1.8,<1.9
    d19: Django>=1.9,<1.10
    d110: Django>=1.10,<1.11
    d111: Django>=1.11,<2.0
    d20: Django>=2.0,<2.1
    d21: Django>=2.1,<2.2
    d22: Django>=2.2,<3.0
    d30: Django>=3.0,<3.1
    coverage

[testenv:clear]
basepython=python3
commands=coverage erase

[testenv:stats]
basepython=python3
commands=coverage html
